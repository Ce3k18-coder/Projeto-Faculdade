
spring.application.name=SistemaChamados

# Banco de dados H2 persistente
spring.datasource.url=jdbc:h2:file:./data/sistemachamados
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracao do JPA
spring.jpa.hibernate.ddl-auto=update

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Credenciais para testes locais
app.aluno.senha=Aluno@123
app.tecnico.senha=Tecnico@123

# Configuracao de seguranca da sessao
server.servlet.session.timeout=15m
server.servlet.session.cookie.max-age=-1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false