
# Banco de dados PostgreSQL - Render
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracao do JPA
spring.jpa.hibernate.ddl-auto=update

# Limite de conexoes com o banco
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Desabilita o console H2 em producao
spring.h2.console.enabled=false

# Configuracao da porta do Render
server.port=${PORT:8080}
server.address=0.0.0.0

# Credenciais dos usuarios no ambiente online
app.aluno.senha=${ALUNO_PASSWORD}
app.tecnico.senha=${TECNICO_PASSWORD}

# Seguranca das sessoes em producao
server.servlet.session.timeout=15m
server.servlet.session.cookie.max-age=-1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax